name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go tests
        run: go test ./...
      - name: Frontend install
        working-directory: web
        run: npm ci
      - name: Frontend test and build
        working-directory: web
        run: npm test && npm run build
      - name: Browser smoke test
        working-directory: web
        run: npx playwright install --with-deps chromium && npm run smoke
      - name: Fixture harness smoke test (multi-screen components, no backend)
        working-directory: web
        run: npm run smoke:fixtures
      - name: Container build
        run: docker build -t oxnet-work:ci .
