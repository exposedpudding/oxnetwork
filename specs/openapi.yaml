openapi: 3.1.0
info:
  title: oxnet.work API
  version: 0.1.0
  description: Current read-only API. Inventory uses either simulated demo records or opt-in Tailscale device discovery. Other planned endpoints are documented separately in docs/API_SPEC.md.
servers:
  - url: /api/v1
paths:
  /system:
    get:
      operationId: getSystem
      responses:
        '200':
          description: System metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
  /nodes:
    get:
      operationId: listNodes
      responses:
        '200':
          description: Nodes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Node'
  /nodes/{nodeId}:
    get:
      operationId: getNode
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
  /nodes/{nodeId}/metrics:
    get:
      operationId: getNodeMetrics
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Latest observed metrics; absent fields mean unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
  /services:
    get:
      operationId: listServices
      responses:
        '200':
          description: Services list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Service' }
  /services/{serviceId}:
    get:
      operationId: getService
      parameters:
        - name: serviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Service
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
  /activity:
    get:
      operationId: listActivity
      responses:
        '200':
          description: Simulated activity in demo mode
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Activity' }
  /events:
    get:
      operationId: streamEvents
      responses:
        '200':
          description: Server-sent events stream
          content:
            text/event-stream:
              schema: { type: string }
  /compute/summary:
    get:
      operationId: getComputeSummary
      responses:
        '200':
          description: Demo compute capacity; used and reserved vCPU are zero while jobs are unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputeSummary' }
  /compute/workers:
    get:
      operationId: listWorkers
      responses:
        '200':
          description: Compute workers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Worker' }
  /jobs:
    get:
      operationId: listJobs
      responses:
        '200':
          description: Empty job list in demo mode; no job provider is connected
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: object }
  /network/graph:
    get:
      operationId: getNetworkGraph
      responses:
        '200':
          description: Inventory graph with explicitly observed connections; demo records are simulated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkGraph' }
  /network/connections:
    get:
      operationId: listConnections
      responses:
        '200':
          description: Recorded network and service relationships
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GraphEdge' }
components:
  parameters:
    NodeId:
      name: nodeId
      in: path
      required: true
      schema: { type: string }
  schemas:
    SystemInfo:
      type: object
      required: [name, site_name, version, server_time, features, demo_mode, inventory_source, auth_required]
      properties:
        name: { type: string, const: oxnet.work }
        site_name: { type: string }
        version: { type: string }
        server_time: { type: string, format: date-time }
        demo_mode: { type: boolean }
        inventory_source: { type: string, enum: [demo, tailscale] }
        auth_required: { type: boolean }
        features:
          type: array
          items: { type: string }
    Health:
      type: object
      required: [state, observed_at]
      properties:
        state:
          type: string
          enum: [healthy, degraded, unhealthy, unknown, disabled]
        observed_at: { type: string, format: date-time }
        stale_after_seconds: { type: integer, minimum: 0 }
        source: { type: string }
    Metrics:
      type: object
      properties:
        cpu_percent: { type: number }
        ram_percent: { type: number }
        vcpu: { type: integer }
        ram_gb: { type: integer }
    Node:
      type: object
      required: [id, name, health, capabilities]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        platform: { type: string }
        health: { $ref: '#/components/schemas/Health' }
        capabilities:
          type: array
          items: { type: string }
        addresses:
          type: array
          items: { type: string }
        last_seen: { type: string, format: date-time, description: Last seen by Tailscale; not a host health check }
        freshness:
          type: string
          enum: [fresh, stale, unknown]
        simulated: { type: boolean }
        metrics: { $ref: '#/components/schemas/Metrics' }
    Service:
      type: object
      required: [id, name, health, freshness, simulated]
      properties:
        id: { type: string }
        name: { type: string }
        health: { $ref: '#/components/schemas/Health' }
        freshness: { type: string, enum: [fresh, stale, unknown] }
        simulated: { type: boolean }
    Activity:
      type: object
      required: [id, title, detail, state, occurred_at, simulated]
      properties:
        id: { type: string }
        title: { type: string }
        detail: { type: string }
        state: { type: string }
        occurred_at: { type: string, format: date-time }
        simulated: { type: boolean }
    Worker:
      type: object
      required: [id, node_id, name, state, vcpu_total, vcpu_used, health, freshness, simulated]
      properties:
        id: { type: string }
        node_id: { type: string }
        name: { type: string }
        state: { type: string, enum: [online, draining, offline] }
        vcpu_total: { type: integer }
        vcpu_used: { type: integer }
        health: { $ref: '#/components/schemas/Health' }
        freshness: { type: string, enum: [fresh, stale, unknown] }
        simulated: { type: boolean }
    ComputeSummary:
      type: object
      required: [total_vcpu, used_vcpu, reserved_vcpu, active_jobs, queued_jobs, observed_at, freshness, simulated]
      properties:
        total_vcpu: { type: integer }
        used_vcpu: { type: integer }
        reserved_vcpu: { type: integer }
        active_jobs: { type: integer }
        queued_jobs: { type: integer }
        observed_at: { type: string, format: date-time }
        freshness: { type: string, enum: [fresh, stale, unknown] }
        simulated: { type: boolean }
    ActionRequest:
      type: object
      required: [type, idempotency_key]
      properties:
        type: { type: string }
        idempotency_key: { type: string }
        parameters:
          type: object
          additionalProperties: true
    Action:
      type: object
      required: [id, type, state, target_id, created_at]
      properties:
        id: { type: string }
        type: { type: string }
        state:
          type: string
          enum: [pending, dispatched, running, succeeded, failed, cancelled, expired]
        target_id: { type: string }
        created_at: { type: string, format: date-time }
    GraphNode:
      type: object
      required: [id, resource_id, kind, label, health, freshness, simulated]
      properties:
        id: { type: string }
        resource_id: { type: string }
        kind: { type: string }
        label: { type: string }
        health: { $ref: '#/components/schemas/Health' }
        freshness: { type: string, enum: [fresh, stale, unknown] }
        simulated: { type: boolean }
    GraphEdge:
      type: object
      required: [id, source, target, kind, observed_at, stale_after_seconds, source_system, freshness, simulated]
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        kind: { type: string }
        observed_at: { type: string, format: date-time }
        stale_after_seconds: { type: integer, minimum: 0 }
        source_system: { type: string }
        freshness: { type: string, enum: [fresh, stale, unknown] }
        simulated: { type: boolean }
    NetworkGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/GraphNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/GraphEdge' }
