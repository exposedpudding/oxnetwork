services:
  oxnet-work:
    build:
      context: ..
    image: oxnet-work:dev
    environment:
      OXNET_ALLOW_UNAUTHENTICATED_BIND: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - oxnet-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  oxnet-data:
