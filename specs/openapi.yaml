openapi: 3.1.0
info:
  title: oxnet.work API
  version: 0.1.0
  description: Current API. Inventory uses either simulated demo records or opt-in Tailscale device discovery and is read-only. Automations (workflows, runs, audit) can be changed when /system reports mutations_enabled; every mutation requires a JSON content type, a same-origin Origin when one is sent, and, with sign-in enabled, the X-CSRF-Token session header. Other planned endpoints are documented separately in docs/API_SPEC.md.
servers:
  - url: /api/v1
paths:
  /system:
    get:
      operationId: getSystem
      responses:
        '200':
          description: System metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
  /nodes:
    get:
      operationId: listNodes
      responses:
        '200':
          description: Nodes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Node'
  /nodes/{nodeId}:
    get:
      operationId: getNode
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
  /nodes/{nodeId}/metrics:
    get:
      operationId: getNodeMetrics
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Latest observed metrics; absent fields mean unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
  /services:
    get:
      operationId: listServices
      responses:
        '200':
          description: Services list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Service' }
  /services/{serviceId}:
    get:
      operationId: getService
      parameters:
        - name: serviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Service
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
  /activity:
    get:
      operationId: listActivity
      responses:
        '200':
          description: Simulated activity in demo mode
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Activity' }
  /events:
    get:
      operationId: streamEvents
      responses:
        '200':
          description: Server-sent events stream
          content:
            text/event-stream:
              schema: { type: string }
  /compute/summary:
    get:
      operationId: getComputeSummary
      responses:
        '200':
          description: Demo compute capacity; used and reserved vCPU are zero while jobs are unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputeSummary' }
  /compute/workers:
    get:
      operationId: listWorkers
      responses:
        '200':
          description: Compute workers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Worker' }
  /jobs:
    get:
      operationId: listJobs
      responses:
        '200':
          description: Empty job list in demo mode; no job provider is connected
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: object }
  /network/graph:
    get:
      operationId: getNetworkGraph
      responses:
        '200':
          description: Inventory graph with explicitly observed connections; demo records are simulated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkGraph' }
  /network/connections:
    get:
      operationId: listConnections
      responses:
        '200':
          description: Recorded network and service relationships
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GraphEdge' }
  /automations/summary:
    get:
      operationId: getAutomationSummary
      responses:
        '200':
          description: Counts for the Automations page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationSummary' }
        '503': { $ref: '#/components/responses/Error' }
  /workflows/options:
    get:
      operationId: getWorkflowOptions
      description: What the runner can execute now (actions, targets, notification channels) plus actions planned for later milestones.
      responses:
        '200':
          description: Editor options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationOptions' }
        '503': { $ref: '#/components/responses/Error' }
  /workflows:
    get:
      operationId: listWorkflows
      responses:
        '200':
          description: Workflows with their last run and next scheduled run
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Workflow' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createWorkflow
      description: Create a workflow. Omitted `enabled` defaults to true. Workflows that reference an action the server cannot execute are rejected with ACTION_NOT_SUPPORTED.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
  /workflows/{workflowId}:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      operationId: getWorkflow
      responses:
        '200':
          description: Workflow
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateWorkflow
      description: Merges the request onto the stored definition. Omitted fields keep their stored values; a supplied `steps` array replaces all steps.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /workflows/{workflowId}/run:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    post:
      operationId: runWorkflow
      description: Starts a manual run in the background and returns the queued run. One run per workflow at a time.
      responses:
        '202':
          description: Run accepted
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRun' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: WORKFLOW_DISABLED or RUN_IN_PROGRESS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /workflows/{workflowId}/enable:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    post:
      operationId: enableWorkflow
      responses:
        '200':
          description: Enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /workflows/{workflowId}/disable:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    post:
      operationId: disableWorkflow
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /workflows/{workflowId}/runs:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      operationId: listWorkflowRuns
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 25 } }
      responses:
        '200':
          description: Runs for one workflow, newest first, without step detail
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WorkflowRun' }
        '404': { $ref: '#/components/responses/Error' }
  /workflow-runs:
    get:
      operationId: listRecentRuns
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 10 } }
      responses:
        '200':
          description: Recent runs across all workflows, newest first, without step detail
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WorkflowRun' }
  /workflow-runs/{runId}:
    get:
      operationId: getWorkflowRun
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Run including step results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRun' }
        '404': { $ref: '#/components/responses/Error' }
  /audit:
    get:
      operationId: listAudit
      description: Append-only audit trail, newest first. `next_cursor` is the id to pass as `cursor` for the next older page.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: target_type, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  next_cursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: Error. Validation failures include per-field `details`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  parameters:
    NodeId:
      name: nodeId
      in: path
      required: true
      schema: { type: string }
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema: { type: string }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 'e.g. INVALID_WORKFLOW, ACTION_NOT_SUPPORTED, MUTATIONS_DISABLED, CROSS_ORIGIN, CSRF_INVALID, WORKFLOW_DISABLED, RUN_IN_PROGRESS, NOT_FOUND' }
            message: { type: string }
            request_id: { type: string }
            details:
              type: object
              description: Field messages keyed like the editor ("name", "trigger", "steps", "step.0.action").
              additionalProperties: { type: string }
    Trigger:
      oneOf:
        - type: object
          required: [type]
          properties: { type: { const: manual } }
        - type: object
          required: [type, expression]
          properties:
            type: { const: cron }
            expression: { type: string, description: 'Standard 5-field cron in UTC' }
        - type: object
          required: [type, target_id, condition, for_seconds]
          properties:
            type: { const: health_condition }
            target_id: { type: string }
            condition: { type: string, enum: [unhealthy, degraded, stale] }
            for_seconds: { type: integer, minimum: 0, maximum: 86400 }
    Step:
      oneOf:
        - type: object
          required: [id, type, name, action_type, target_id]
          properties:
            id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
            type: { const: action }
            name: { type: string, maxLength: 80 }
            action_type: { type: string, description: 'See GET /workflows/options' }
            target_id: { type: string }
        - type: object
          required: [id, type, name, channel, message]
          properties:
            id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
            type: { const: notify }
            name: { type: string, maxLength: 80 }
            channel: { type: string }
            message: { type: string, maxLength: 500 }
    WorkflowInput:
      type: object
      required: [name, trigger, steps]
      additionalProperties: false
      properties:
        id: { type: string, description: Ignored on create and update }
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 240 }
        enabled: { type: boolean }
        trigger: { $ref: '#/components/schemas/Trigger' }
        steps:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/Step' }
        on_success:
          type: object
          properties: { notify_channel: { type: string } }
        on_failure:
          type: object
          properties:
            behavior: { type: string, enum: [stop, continue], default: stop }
            notify_channel: { type: string }
    RunSummary:
      type: object
      required: [id, state, trigger, started_at, finished_at, duration_ms]
      properties:
        id: { type: string }
        state: { $ref: '#/components/schemas/RunState' }
        trigger: { type: string, enum: [manual, cron, health_condition] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        duration_ms: { type: [integer, 'null'] }
    Workflow:
      allOf:
        - $ref: '#/components/schemas/WorkflowInput'
        - type: object
          required: [id, enabled, simulated, created_at, updated_at, last_run, next_run_at]
          properties:
            id: { type: string }
            enabled: { type: boolean }
            simulated: { type: boolean, description: True for seeded demo workflows }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            last_run: { oneOf: [{ $ref: '#/components/schemas/RunSummary' }, { type: 'null' }] }
            next_run_at: { type: [string, 'null'], format: date-time, description: Next cron firing for enabled cron workflows }
    RunState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    RunStep:
      type: object
      required: [position, step_id, kind, name, state, started_at, finished_at, output]
      properties:
        position: { type: integer }
        step_id: { type: string, description: '"outcome" for the success or failure notification appended after the ordered steps' }
        kind: { type: string, enum: [action, notify] }
        name: { type: string }
        state: { type: string, enum: [pending, running, succeeded, failed, skipped] }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        output: { type: string }
        error_code: { type: string }
    WorkflowRun:
      type: object
      required: [id, workflow_id, workflow_name, trigger, actor, state, started_at, finished_at, duration_ms, summary, simulated]
      properties:
        id: { type: string }
        workflow_id: { type: string }
        workflow_name: { type: string }
        trigger: { type: string }
        actor: { type: string }
        state: { $ref: '#/components/schemas/RunState' }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        duration_ms: { type: [integer, 'null'] }
        error_code: { type: string }
        summary: { type: string }
        simulated: { type: boolean }
        steps:
          type: array
          description: Present on GET /workflow-runs/{runId} and the run response; omitted from lists
          items: { $ref: '#/components/schemas/RunStep' }
    AutomationSummary:
      type: object
      required: [workflows, enabled, disabled, scheduled_count, next_scheduled_at, runs_last_7_days, succeeded_last_7_days, success_rate, failed_last_24h, active_runs, generated_at, simulated]
      properties:
        workflows: { type: integer }
        enabled: { type: integer }
        disabled: { type: integer }
        scheduled_count: { type: integer }
        next_scheduled_at: { type: [string, 'null'], format: date-time }
        runs_last_7_days: { type: integer }
        succeeded_last_7_days: { type: integer }
        success_rate: { type: [number, 'null'], description: 'Percentage; null when no run finished in the last 7 days' }
        failed_last_24h: { type: integer }
        active_runs: { type: integer }
        generated_at: { type: string, format: date-time }
        simulated: { type: boolean }
    AutomationOptions:
      type: object
      required: [action_types, targets, channels, planned_actions]
      properties:
        action_types:
          type: array
          items:
            type: object
            required: [value, label]
            properties: { value: { type: string }, label: { type: string }, dangerous: { type: boolean } }
        targets:
          type: array
          items:
            type: object
            required: [id, label]
            properties: { id: { type: string }, label: { type: string } }
        channels:
          type: array
          items:
            type: object
            required: [value, label]
            properties: { value: { type: string }, label: { type: string } }
        planned_actions:
          type: array
          items:
            type: object
            required: [value, label, milestone]
            properties: { value: { type: string }, label: { type: string }, milestone: { type: string } }
    AuditEvent:
      type: object
      required: [id, occurred_at, actor, action, target_type, target_id, outcome, detail]
      properties:
        id: { type: integer }
        occurred_at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string, description: 'e.g. workflow.created, workflow.run.started, workflow.run.finished, workflow.notification, workflow.run.skipped' }
        target_type: { type: string }
        target_id: { type: string }
        outcome: { type: string, enum: [succeeded, failed, skipped] }
        detail: { type: object, additionalProperties: true, description: Sanitised parameters; never secrets }
    SystemInfo:
      type: object
      required: [name, site_name, version, server_time, features, demo_mode, inventory_source, auth_required]
      properties:
        name: { type: string, const: oxnet.work }
        site_name: { type: string }
        version: { type: string }
        server_time: { type: string, format: date-time }
        demo_mode: { type: boolean }
        inventory_source: { type: string, enum: [demo, tailscale] }
        auth_required: { type: boolean }
        mutations_enabled: { type: boolean, description: True when this server accepts workflow changes (signed in, or bound to loopback) }
        features:
          type: array
          items: { type: string }
    Health:
      type: object
      required: [state, observed_at]
      properties:
        state:
          type: string
          enum: [healthy, degraded, unhealthy, unknown, disabled]
        observed_at: { type: string, format: date-time }
        stale_after_seconds: { type: integer, minimum: 0 }
        source: { type: string }
    Metrics:
      type: object
      properties:
        cpu_percent: { type: number }
        ram_percent: { type: number }
        vcpu: { type: integer }
        ram_gb: { type: integer }
    Node:
      type: object
      required: [id, name, health, capabilities]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        platform: { type: string }
        health: { $ref: '#/components/schemas/Health' }
        capabilities:
          type: array
          items: { type: string }
        addresses:
          type: array
          items: { type: string }
        last_seen: { type: string, format: date-time, description: Last seen by Tailscale; not a host health check }
        freshness:
          type: string
          enum: [fresh, stale, unknown]
        simulated: { type: boolean }
        metrics: { $ref: '#/components/schemas/Metrics' }
    Service:
      type: object
      required: [id, name, health, freshness, simulated]
      properties:
        id: { type: string }
        name: { type: string }
        health: { $ref: '#/components/schemas/Health' }
        freshness: { type: string, enum: [fresh, stale, unknown] }
        simulated: { type: boolean }
        endpoint: { type: string, description: 'Address a probe checked, query string removed. Absent for services that are not probed.' }
        detail: { type: string, description: 'Short probe result, e.g. "HTTP 200 in 41 ms", "HTTP 502 (expected 200/204)", "no response within 3s". Absent when not probed.' }
    Activity:
      type: object
      required: [id, title, detail, state, occurred_at, simulated]
      properties:
        id: { type: string }
        title: { type: string }
        detail: { type: string }
        state: { type: string }
        occurred_at: { type: string, format: date-time }
        simulated: { type: boolean }
    Worker:
      type: object
      required: [id, node_id, name, state, vcpu_total, vcpu_used, health, freshness, simulated]
      properties:
        id: { type: string }
        node_id: { type: string }
        name: { type: string }
        state: { type: string, enum: [online, draining, offline] }
        vcpu_total: { type: integer }
        vcpu_used: { type: integer }
        health: { $ref: '#/components/schemas/Health' }
        freshness: { type: string, enum: [fresh, stale, unknown] }
        simulated: { type: boolean }
    ComputeSummary:
      type: object
      required: [total_vcpu, used_vcpu, reserved_vcpu, active_jobs, queued_jobs, observed_at, freshness, simulated]
      properties:
        total_vcpu: { type: integer }
        used_vcpu: { type: integer }
        reserved_vcpu: { type: integer }
        active_jobs: { type: integer }
        queued_jobs: { type: integer }
        observed_at: { type: string, format: date-time }
        freshness: { type: string, enum: [fresh, stale, unknown] }
        simulated: { type: boolean }
    ActionRequest:
      type: object
      required: [type, idempotency_key]
      properties:
        type: { type: string }
        idempotency_key: { type: string }
        parameters:
          type: object
          additionalProperties: true
    Action:
      type: object
      required: [id, type, state, target_id, created_at]
      properties:
        id: { type: string }
        type: { type: string }
        state:
          type: string
          enum: [pending, dispatched, running, succeeded, failed, cancelled, expired]
        target_id: { type: string }
        created_at: { type: string, format: date-time }
    GraphNode:
      type: object
      required: [id, resource_id, kind, label, health, freshness, simulated]
      properties:
        id: { type: string }
        resource_id: { type: string }
        kind: { type: string }
        label: { type: string }
        health: { $ref: '#/components/schemas/Health' }
        freshness: { type: string, enum: [fresh, stale, unknown] }
        simulated: { type: boolean }
    GraphEdge:
      type: object
      required: [id, source, target, kind, observed_at, stale_after_seconds, source_system, freshness, simulated]
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        kind: { type: string }
        observed_at: { type: string, format: date-time }
        stale_after_seconds: { type: integer, minimum: 0 }
        source_system: { type: string }
        freshness: { type: string, enum: [fresh, stale, unknown] }
        simulated: { type: boolean }
    NetworkGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/GraphNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/GraphEdge' }
