server:
  listen: "127.0.0.1:8080"
  data_dir: "./data"
  web_dir: "./web/dist"
ui:
  site_name: "Homelab"
features:
  demo_provider: true
  actions_enabled: false
# For authenticated read-only Tailscale inventory, set demo_provider: false
# and use a Tailscale OAuth client with only devices:core:read permission.
# tailscale:
#   tailnet: "-" # Tailscale shorthand for the credential's own tailnet
#   oauth_client_id: "replace-with-tailscale-client-id"
#   oauth_client_secret_file: "/run/secrets/tailscale_oauth_client_secret"
# To enable Authentik or another OIDC provider, set all four values below.
# Keep the client secret in a mounted file, never in this YAML.
# auth:
#   issuer_url: "https://auth.example.invalid/application/o/oxnet-work/"
#   client_id: "replace-with-oidc-client-id"
#   client_secret_file: "/run/secrets/oidc_client_secret"
#   public_url: "https://oxnet.example.invalid"
