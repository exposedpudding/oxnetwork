# Optional read-only inventory overlay. Apply only after private HTTPS and
# Authentik OIDC sign-in have been verified from a tailnet client.
services:
  oxnet-work:
    environment:
      OXNET_DEMO_PROVIDER: "false"
      OXNET_TAILSCALE_TAILNET: "-"
      OXNET_TAILSCALE_OAUTH_CLIENT_ID: ${OXNET_TAILSCALE_OAUTH_CLIENT_ID:?Set OXNET_TAILSCALE_OAUTH_CLIENT_ID in .env}
      OXNET_TAILSCALE_OAUTH_CLIENT_SECRET_FILE: /run/secrets/tailscale_oauth_client_secret
    secrets:
      - tailscale_oauth_client_secret

secrets:
  tailscale_oauth_client_secret:
    file: ./secrets/tailscale_oauth_client_secret
