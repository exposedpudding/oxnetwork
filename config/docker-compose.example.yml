services:
  oxnet-work:
    image: ghcr.io/example/oxnet-work:latest
    container_name: oxnet-work
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      OXNET_CONFIG: /config/config.yaml
      OXNET_DATA_DIR: /data
    env_file:
      - .env
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - oxnet-data:/data
    # Prefer restricting port exposure to a private interface or tailnet.
    # Do not mount the Docker socket into this control-plane container.

volumes:
  oxnet-data:
